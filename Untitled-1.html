<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f2f2f2;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .login-box {
      background: white;
      width: 320px;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.15);
    }

    h2 {
      text-align: center;
      margin-bottom: 25px;
    }

    input {
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 6px;
    }

    button {
      width: 100%;
      padding: 12px;
      margin-top: 15px;
      background: #4285f4;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    button:hover {
      background: #3367d6;
    }

    #message {
      text-align: center;
      margin-top: 15px;
      color: red;
    }
  </style>
</head>

<body>

  <div class="login-box">
    <h2>Login</h2>

    <input
      type="email"
      id="email"
      placeholder="Enter Gmail ID"
      required
    >

    <input
      type="password"
      id="password"
      placeholder="Enter Password"
      required
    >

    <button onclick="login()">Login</button>

    <p id="message"></p>
  </div>

  <script>
    // Change this to the Gmail ID you want to allow
    const allowedEmail = "example@gmail.com";

    function login() {
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;
      const message = document.getElementById("message");

      if (email !== allowedEmail) {
        message.textContent = "This Gmail ID is not authorized.";
        return;
      }

      if (password === "") {
        message.textContent = "Please enter your password.";
        return;
      }

      message.style.color = "green";
      message.textContent = "Login successful!";
      
      // Redirect after successful login
      // window.location.href = "dashboard.html";
    }
  </script>

</body>
</html>
